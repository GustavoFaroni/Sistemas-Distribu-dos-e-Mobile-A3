<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - Controle de Veículos</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --light-bg: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #e9ecef; }
        
        /* Navbar / Menu */
        .navbar { background-color: #343a40; padding: 10px 0; color: white; display: flex; justify-content: center; gap: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .nav-item { cursor: pointer; padding: 10px 20px; border-radius: 5px; transition: background 0.3s; font-weight: bold; text-transform: uppercase; }
        .nav-item:hover { background-color: #495057; }
        .nav-item.active { background-color: var(--primary-color); }

        .container { max-width: 1000px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-top: 0; }
        
        /* Seções de Menu */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilo da Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 15px; border-bottom: 1px solid #dee2e6; text-align: left; }
        th { background-color: #f1f3f5; color: #495057; }
        tr:hover { background-color: #f8f9fa; }

        /* Botões */
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-register { background-color: var(--success-color); color: white; }
        .btn-edit { background-color: var(--warning-color); color: #212529; }
        .btn-exit { background-color: var(--danger-color); color: white; }
        
        /* Formulário */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; font-weight: bold; color: #555; }
        .form-group input { padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; }
        .form-actions { grid-column: span 2; display: flex; gap: 10px; margin-top: 10px; }
        .form-actions button { flex: 1; }

        .empty-msg { text-align: center; padding: 40px; color: #6c757d; font-style: italic; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-item active" id="nav-parking" onclick="showSection('parking')">🅿️ Estacionamento</div>
    <div class="nav-item" id="nav-register" onclick="showSection('register')">➕ Registrar Entrada</div>
</div>

<div class="container">
    <h1>Controle de Estacionamento</h1>

    <!-- ABA 1: LISTA DE VEÍCULOS (PARKING) -->
    <div id="parking" class="section active">
        <h2>Veículos Estacionados</h2>
        <div id="loading" style="text-align: center; display: none;">Buscando dados...</div>
        <table id="veiculos-table">
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Placa</th>
                    <th>Cor</th>
                    <th style="text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="veiculos-list">
                <!-- JS preenche aqui -->
            </tbody>
        </table>
        <div id="empty-state" class="empty-msg" style="display: none;">Não há veículos estacionados no momento.</div>
    </div>

    <!-- ABA 2: CADASTRO / EDIÇÃO -->
    <div id="register" class="section">
        <h2 id="form-title">Registrar Novo Veículo</h2>
        <form id="veiculo-form">
            <input type="hidden" id="veiculo-id">
            <div class="form-grid">
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" id="marca" placeholder="Ex: Toyota" required>
                </div>
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text" id="modelo" placeholder="Ex: Corolla" required>
                </div>
                <div class="form-group">
                    <label>Ano</label>
                    <input type="number" id="ano" placeholder="Ex: 2023" required>
                </div>
                <div class="form-group">
                    <label>Placa</label>
                    <input type="text" id="placa" placeholder="Ex: ABC-1234" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Cor</label>
                    <input type="text" id="cor" placeholder="Ex: Prata" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-submit" class="btn btn-register">Confirmar Registro</button>
                    <button type="button" id="btn-cancel" class="btn" style="background-color: var(--secondary-color); color: white; display: none;">Cancelar Edição</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api/veiculos';
    const form = document.getElementById('veiculo-form');
    const veiculosList = document.getElementById('veiculos-list');
    const emptyState = document.getElementById('empty-state');
    const formTitle = document.getElementById('form-title');
    const btnSubmit = document.getElementById('btn-submit');
    const btnCancel = document.getElementById('btn-cancel');

    // Navegação entre abas
    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        
        document.getElementById(sectionId).classList.add('active');
        const navItem = sectionId === 'parking' ? document.getElementById('nav-parking') : document.getElementById('nav-register');
        navItem.classList.add('active');

        if (sectionId === 'parking') {
            fetchVeiculos();
        }
    }

    // Buscar dados da API
    async function fetchVeiculos() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderVeiculos(data);
        } catch (error) {
            console.error('Erro:', error);
        }
    }

    function renderVeiculos(veiculos) {
        veiculosList.innerHTML = '';
        if (veiculos.length === 0) {
            emptyState.style.display = 'block';
            document.getElementById('veiculos-table').style.display = 'none';
        } else {
            emptyState.style.display = 'none';
            document.getElementById('veiculos-table').style.display = 'table';
            veiculos.forEach(v => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.marca}</td>
                    <td>${v.modelo}</td>
                    <td>${v.ano}</td>
                    <td><strong>${v.placa}</strong></td>
                    <td>${v.cor}</td>
                    <td style="text-align: center; min-width: 150px;">
                        <button class="btn btn-edit" onclick="editVeiculo(${v.id})">Editar</button>
                        <button class="btn btn-exit" onclick="deleteVeiculo(${v.id})">Saída</button>
                    </td>
                `;
                veiculosList.appendChild(tr);
            });
        }
    }

    // Criar ou Atualizar
    form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('veiculo-id').value;
        const veiculoData = {
            marca: document.getElementById('marca').value,
            modelo: document.getElementById('modelo').value,
            ano: parseInt(document.getElementById('ano').value),
            placa: document.getElementById('placa').value,
            cor: document.getElementById('cor').value
        };

        try {
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(veiculoData)
            });

            if (response.ok) {
                alert(id ? 'Veículo atualizado com sucesso!' : 'Veículo registrado com sucesso!');
                resetForm();
                // Importante: atualizar os dados antes de trocar de aba
                await fetchVeiculos();
                showSection('parking');
            } else {
                const err = await response.json();
                alert('Erro: ' + (err.error || 'Falha na operação'));
            }
        } catch (error) {
            alert('Erro de conexão com o servidor.');
        }
    };

    // Dar Saída (Remover)
    async function deleteVeiculo(id) {
        if (confirm('Deseja registrar a SAÍDA deste veículo?')) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    await fetchVeiculos();
                } else {
                    alert('Erro ao processar saída.');
                }
            } catch (error) {
                alert('Erro de conexão ao processar saída.');
            }
        }
    }

    // Editar (Preencher formulário)
    async function editVeiculo(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            const v = await response.json();
            
            document.getElementById('veiculo-id').value = v.id;
            document.getElementById('marca').value = v.marca;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('ano').value = v.ano;
            document.getElementById('placa').value = v.placa;
            document.getElementById('cor').value = v.cor;

            formTitle.innerText = 'Editar Informações do Veículo';
            btnSubmit.innerText = 'Salvar Alterações';
            btnSubmit.className = 'btn btn-edit'; // Atualiza a cor para amarelo
            btnCancel.style.display = 'inline-block';
            
            // Troca para a aba de formulário sem resetar
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('register').classList.add('active');
            document.getElementById('nav-register').classList.add('active');

        } catch (error) {
            alert('Erro ao buscar dados.');
        }
    }

    btnCancel.onclick = () => {
        resetForm();
        showSection('parking');
    };

    function resetForm() {
        form.reset();
        document.getElementById('veiculo-id').value = '';
        formTitle.innerText = 'Registrar Novo Veículo';
        btnSubmit.innerText = 'Confirmar Registro';
        btnSubmit.className = 'btn btn-register';
        btnCancel.style.display = 'none';
    }

    // Carga inicial
    fetchVeiculos();
</script>

</body>
</html>
